# ══════════════════════════════════════════════════════════════════
# Tyrolium-ServerTemplate — Nginx (SPA)
# Généré par scripts/tyrobuild.mjs : ne pas modifier dans prod/,
# modifier scripts/server-config/nginx.conf puis relancer tyrobuild.
#
# Nginx ne lit pas de fichier dans le dossier du site (pas d'équivalent au .htaccess) :
# ce bloc est à inclure dans la config du serveur, ex. dans /etc/nginx/sites-available/default
#   include /var/www/html/.tyro-nginx.conf;     (ou copier le bloc)
#   → si le site est déployé ailleurs que dans /var/www/html, adapter "root" (option nginxRoot de tyrobuild)
#   → vérifier puis recharger : nginx -t && systemctl reload nginx
# HTTPS : certbot (--nginx) ajoute lui-même listen 443 / ssl_certificate dans ce bloc.
# ══════════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;
    charset utf-8;
    autoindex off;

    # Fichiers cachés (.git, .gitignore, ce fichier…) : jamais servis
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Fichier ou dossier existant, sinon point d'entrée d'Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

}
