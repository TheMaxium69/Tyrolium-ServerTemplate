# ══════════════════════════════════════════════════════════════════
# Tyrolium-ServerTemplate — Nginx (SPA)
# Généré par scripts/tyrobuild.mjs : ne pas modifier dans prod/,
# modifier scripts/server-config/nginx.conf puis relancer tyrobuild.
#
# Fragment à inclure DANS le bloc server { } du site (/etc/nginx/sites-available/<serveur>.tyrolium.fr) :
#
#   server {
#       server_name <serveur>.tyrolium.fr _;
#       listen 443 ssl default_server;   (page par défaut : toute requête sans site dédié)
#       root /var/www/<serveur>.tyrolium.fr;
#       index index.html;
#
#       include /var/www/<serveur>.tyrolium.fr/.tyro-nginx.conf;
#
#       … gzip, lignes "managed by Certbot" : restent dans le bloc server
#   }
#
# Ce fragment gère : fichiers cachés, routage Angular, pages d'erreur (vrais codes HTTP), cache navigateur.
# La compression (gzip) reste dans le bloc server.
# → retirer du bloc server les "location /", "location ~ /\." , "error_page", le bloc de cache qu'il avait déjà
# → vérifier puis recharger : nginx -t && systemctl reload nginx
# ══════════════════════════════════════════════════════════════════

charset utf-8;
autoindex off;

# ── En-têtes de sécurité ───────────────────────────────────────────
# ⚠ Nginx : un add_header dans un bloc location annule ceux du niveau au-dessus.
#   Ils sont donc répétés dans chaque location qui a ses propres add_header (cache, WebP).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Fichiers cachés (.git, .gitignore, ce fichier…) : jamais servis
location ~ /\.(?!well-known/) {
    return 404;
}

# Fichier ou dossier existant, sinon point d'entrée d'Angular
location / {
    try_files $uri $uri/ /index.html;
    # Pages HTML : même nom à chaque déploiement → toujours revalidées
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# ── Cache navigateur ───────────────────────────────────────────────
# Fichiers du build avec un code dans le nom (main-XXXXXXXX.js, styles-…css, polices de media/) :
# leur nom change dès que leur contenu change → gardés 1 an, sans jamais redemander
# (regex entre guillemets : obligatoire dès qu'elle contient des accolades comme {8})
location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

# Images PNG / JPEG : la version WebP (logo.png.webp, créée par tyrobuild) aux navigateurs qui l'acceptent,
# sinon le PNG / JPEG d'origine — même adresse, sans toucher aux pages
location ~* \.(?:png|jpe?g)$ {
    set $webp "";
    if ($http_accept ~* "image/webp") { set $webp ".webp"; }
    add_header Vary Accept;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    expires 7d;
    access_log off;
    try_files $uri$webp $uri =404;
}

# Autres images, polices, médias sans code dans le nom : 7 jours
# (un fichier remplacé sous le même nom est vu par tous au plus tard une semaine après)
location ~* \.(?:gif|webp|avif|ico|svg|woff2?|ttf|otf|mp4|webm|m4a|mp3|pdf)$ {
    expires 7d;
    access_log off;
}
